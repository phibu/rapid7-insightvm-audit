rapid7:
  base_url: https://us.api.insight.rapid7.com
  verify_tls: true
  # Per-request read timeout. Bump to 60 or 120 if you see
  # "network error after N attempt(s) on GET /api/3/...: Read timed out"
  # in the report — Rapid7-hosted consoles can be sluggish under load.
  request_timeout_seconds: 30
  # Number of retries on transient errors (incl. read timeouts). Total
  # worst-case wait per call ≈ (max_retries + 1) * request_timeout_seconds.
  max_retries: 3
  # auth_mode: api_key  # default; reads R7_API_KEY from env / .env
  # auth_mode: basic    # use HTTP Basic Auth; reads R7_BASIC_USER + R7_BASIC_PASSWORD
                        # required for Rapid7-hosted consoles where SAML/MFA users
                        # cannot mint a console-local API key in the UI

report:
  output_dir: ./reports
  filename_pattern: "rapid7-health-{timestamp}.html"
  title: "Rapid7 InsightVM Environment Health Check"
  # How many days back to compare against a prior report when computing the
  # "since last run" delta strip. null disables the feature.
  delta_max_age_days: 30

thresholds:
  scan_engines:
    last_contact_warn_hours: 2
    last_contact_fail_hours: 24
  scan_activity:
    recent_window_days: 7
    stuck_scan_hours: 24
    site_no_scan_days: 14
  asset_coverage:
    stale_asset_days: 30
    flag_unscanned_assets: true
    never_scanned_days: 90
    # New in 0.2.7 — see README "Asset Coverage" section.
    # Flag asset groups whose membership criteria match zero assets
    # (orphaned RBAC/report scopes).
    flag_dead_asset_groups: true
    # Flag assets where the most recent scan was unauthenticated
    # (vulnerability-assessed=false) — surface-level visibility only.
    flag_unauth_only_assets: true
    # Flag assets recently scanned but with zero detected services —
    # usually a firewall blocking the scan engine or a scope misconfig.
    flag_no_services_detected: true
    # Flag Insight Agent-managed assets that fall outside every site's
    # configured scan target ranges — they only get opportunistic agent
    # data, never scheduled scans. REQUIRES audit.full_scan: true to
    # actually run (per-asset GETs are too expensive for the fast path).
    flag_agent_only_assets: false
  data_quality:
    flag_missing_os: true
    flag_empty_sites: true
    # Flag assets whose last scan is older than this many days. Distinct from
    # asset_coverage.never_scanned_days — that signals a coverage gap; this
    # signals the asset record itself is so stale the data is unreliable.
    flag_stale_assets: true
    stale_asset_days: 180
    # Flag duplicate asset records (same hostName / same ip across multiple
    # asset IDs). Classic agent + scan-engine collision; also surfaces
    # DHCP-driven re-IPing when MAC tracking is incomplete.
    flag_duplicate_hostnames: true
    flag_duplicate_ips: true

checks:
  scan_engines: true
  scan_activity: true
  asset_coverage: true
  data_quality: true
  configuration_audit: true
  user_permission_audit: true

audit:
  enabled: true
  full_scan: false
  sample_size: 500
  rules:
    agent_unauth_collision:
      # Note: in fast mode (audit.full_scan: false), this rule's per-site
      # enumeration is capped at audit.sample_size and short-circuits on the
      # first agent-managed asset found. Sites that exceed the cap without a
      # match are listed in a single aggregate info finding. Set
      # audit.full_scan: true to remove the cap.
      enabled: true
      severity: fail
    site_vuln_template_no_creds:
      enabled: true
      severity: fail
    overlapping_scan_windows:
      enabled: true
      severity: warn
    single_engine_overload:
      enabled: true
      severity: warn
      asset_count_threshold: 5000
    discovery_template_on_prod_site:
      enabled: true
      severity: warn
    policy_and_vuln_in_same_template:
      enabled: true
      severity: warn
    local_engine_production_scope:
      enabled: true
      severity: warn
      asset_count_threshold: 1000
      # Override if you renamed the local engine away from "Local scan engine":
      # additional_local_names: ["my-renamed-local-engine"]
    dynamic_groups_and_nested_tags:
      enabled: true
      severity: warn
      dynamic_group_limit: 50
    scan_report_schedule_overlap:
      enabled: true
      severity: warn
      assumed_report_duration_minutes: 30
      assumed_scan_duration_minutes: 60
    engine_version_drift:
      enabled: true
      severity: warn
      refresh_stale_days: 7
      check_product_version: true
      check_content_version: true
    insight_agent_deployed:
      enabled: true
      severity: info
    insight_agent_version_currency:
      enabled: true
      severity: warn
      version_drift_minor: 1
      # Pin to an exact version for change-control-managed fleets. When set,
      # both behind-pin and ahead-of-pin agents are flagged. Mutually exclusive
      # with use_latest_known (pinned wins).
      # pinned_version: "4.1.0.2"

      # Compare against the tool-maintained "current latest" Insight Agent
      # version. Honors version_drift_minor as the tolerance.
      # use_latest_known: false

# User & Permission Audit — sibling to `audit:`, scoped to console user
# accounts and authentication settings. Requires the API key to belong
# to a Global Administrator (the underlying /api/3/users endpoint is
# GA-only). Disable with `user_audit.enabled: false` or with the
# `checks.user_permission_audit: false` toggle above.
user_audit:
  enabled: true
  full_scan: false
  sample_size: 500
  rules:
    privileged_user_without_mfa:
      enabled: true
      severity: fail
      # Allowlist logins that legitimately authenticate via Basic Auth
      # (which bypasses MFA at the protocol level) — typically service
      # accounts. Empty by default.
      mfa_exempt_logins: []
    local_account_when_sso_configured:
      enabled: true
      severity: warn
      max_local_accounts_when_sso: 2
    multiple_global_administrators:
      enabled: true
      severity: warn
      max_global_administrators: 2
    locked_user_account:
      enabled: true
      severity: warn
    disabled_user_with_role_bindings:
      enabled: true
      severity: warn
    user_with_role_but_no_access:
      enabled: true
      severity: warn
    superuser_flag_outside_global_admin:
      enabled: true
      severity: fail
