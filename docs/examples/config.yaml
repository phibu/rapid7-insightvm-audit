rapid7:
  base_url: https://us.api.insight.rapid7.com
  verify_tls: true
  # Per-request read timeout. Bump to 60 or 120 if you see
  # "network error after N attempt(s) on GET /api/3/...: Read timed out"
  # in the report — Rapid7-hosted consoles can be sluggish under load.
  request_timeout_seconds: 30
  # Number of retries on transient errors (incl. read timeouts). Total
  # worst-case wait per call ≈ (max_retries + 1) * request_timeout_seconds.
  max_retries: 3
  # auth_mode: api_key  # default; reads R7_API_KEY from env / .env
  # auth_mode: basic    # use HTTP Basic Auth; reads R7_BASIC_USER + R7_BASIC_PASSWORD
                        # required for Rapid7-hosted consoles where SAML/MFA users
                        # cannot mint a console-local API key in the UI

report:
  output_dir: ./reports
  filename_pattern: "rapid7-health-{timestamp}.html"
  title: "Rapid7 InsightVM Environment Health Check"
  # How many days back to compare against a prior report when computing the
  # "since last run" delta strip. null disables the feature.
  delta_max_age_days: 30

thresholds:
  scan_engines:
    last_contact_warn_hours: 2
    last_contact_fail_hours: 24
  scan_activity:
    recent_window_days: 7
    stuck_scan_hours: 24
    site_no_scan_days: 14
  asset_coverage:
    stale_asset_days: 30
    flag_unscanned_assets: true
  data_quality:
    flag_missing_os: true
    flag_empty_sites: true

checks:
  scan_engines: true
  scan_activity: true
  asset_coverage: true
  data_quality: true
  configuration_audit: true
  user_permission_audit: true

audit:
  enabled: true
  full_scan: false
  sample_size: 500
  rules:
    agent_unauth_collision:
      enabled: true
      severity: fail
    site_vuln_template_no_creds:
      enabled: true
      severity: fail
    credential_failure_in_recent_scans:
      enabled: true
      severity: warn
    overlapping_scan_windows:
      enabled: true
      severity: warn
    single_engine_overload:
      enabled: true
      severity: warn
      asset_count_threshold: 5000
    discovery_template_on_prod_site:
      enabled: true
      severity: warn
    policy_and_vuln_in_same_template:
      enabled: true
      severity: warn
    store_invulnerable_results:
      enabled: true
      severity: info
    local_engine_production_scope:
      enabled: true
      severity: warn
      asset_count_threshold: 1000
      # Override if you renamed the local engine away from "Local scan engine":
      # additional_local_names: ["my-renamed-local-engine"]
    dynamic_groups_and_nested_tags:
      enabled: true
      severity: warn
      dynamic_group_limit: 50
    scan_report_schedule_overlap:
      enabled: true
      severity: warn
      assumed_report_duration_minutes: 30
      assumed_scan_duration_minutes: 60
    engine_version_drift:
      enabled: true
      severity: warn
      refresh_stale_days: 7
      check_product_version: true
      check_content_version: true

# User & Permission Audit — sibling to `audit:`, scoped to console user
# accounts and authentication settings. Requires the API key to belong
# to a Global Administrator (the underlying /api/3/users endpoint is
# GA-only). Disable with `user_audit.enabled: false` or with the
# `checks.user_permission_audit: false` toggle above.
user_audit:
  enabled: true
  full_scan: false
  sample_size: 500
  rules:
    privileged_user_without_mfa:
      enabled: true
      severity: fail
      # Allowlist logins that legitimately authenticate via Basic Auth
      # (which bypasses MFA at the protocol level) — typically service
      # accounts. Empty by default.
      mfa_exempt_logins: []
    local_account_when_sso_configured:
      enabled: true
      severity: warn
      max_local_accounts_when_sso: 2
    multiple_global_administrators:
      enabled: true
      severity: warn
      max_global_administrators: 2
    locked_user_account:
      enabled: true
      severity: warn
    disabled_user_with_role_bindings:
      enabled: true
      severity: info
    user_with_role_but_no_access:
      enabled: true
      severity: info
    superuser_flag_outside_global_admin:
      enabled: true
      severity: fail
