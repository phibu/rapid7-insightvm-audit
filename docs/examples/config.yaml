# =============================================================================
# Rapid7 InsightVM Environment Health Check — example configuration
#
# Every key, threshold, and tunable is documented in README.md. This file is
# the canonical template: copy it, adjust values, and pass it via --config.
# =============================================================================

# -----------------------------------------------------------------------------
# Connection — Security Console (v3 API)
# -----------------------------------------------------------------------------
rapid7:
  base_url: https://us.api.insight.rapid7.com
  verify_tls: true
  request_timeout_seconds: 60
  max_retries: 3
  parallel_pages: 1
  page_size: 250
  # auth_mode: api_key   # default — reads R7_API_KEY
  # auth_mode: basic     # reads R7_BASIC_USER + R7_BASIC_PASSWORD

# -----------------------------------------------------------------------------
# Report output
# -----------------------------------------------------------------------------
report:
  output_dir: ./reports
  filename_pattern: "rapid7-health-{timestamp}.html"
  title: "Rapid7 InsightVM Environment Health Check"
  delta_max_age_days: 30
  log_format: plain

# -----------------------------------------------------------------------------
# Thresholds — operational health checks
# -----------------------------------------------------------------------------
thresholds:
  scan_engines:
    last_contact_warn_hours: 24
    last_contact_fail_hours: 36
  scan_activity:
    recent_window_days: 7
    stuck_scan_hours: 24
    site_no_scan_days: 14
  asset_coverage:
    stale_asset_days: 30
    flag_unscanned_assets: true
    never_scanned_days: 90
    flag_dead_asset_groups: true
    dead_groups_fallback_cap: 200
    flag_agent_only_assets: false
  data_quality:
    flag_missing_os: true
    flag_empty_sites: true
    flag_stale_assets: true
    stale_asset_days: 180
    flag_duplicate_hostnames: true
    flag_duplicate_ips: true
    duplicate_detection_max_assets: 50000

# -----------------------------------------------------------------------------
# Check toggles — enable or disable each vertical
# -----------------------------------------------------------------------------
checks:
  scan_engines: true
  scan_activity: true
  asset_coverage: true
  data_quality: true
  configuration_audit: true
  user_permission_audit: true
  cloud_drift_audit: true

# -----------------------------------------------------------------------------
# Configuration Audit
# -----------------------------------------------------------------------------
audit:
  enabled: true
  full_scan: false
  sample_size: 500
  agents_timeout_seconds: 180
  rules:
    agent_unauth_collision:
      enabled: true
      severity: fail
      max_agents: 50000
    site_vuln_template_no_creds:
      enabled: true
      severity: fail
    overlapping_scan_windows:
      enabled: true
      severity: warn
      assumed_scan_duration_minutes: 60
    single_engine_overload:
      enabled: true
      severity: warn
      asset_count_threshold: 5000
    discovery_template_on_prod_site:
      enabled: true
      severity: warn
    policy_and_vuln_in_same_template:
      enabled: true
      severity: warn
    local_engine_production_scope:
      enabled: true
      severity: warn
      asset_count_threshold: 1000
      # additional_local_names: ["my-renamed-local-engine"]
    dynamic_groups_and_nested_tags:
      enabled: true
      severity: warn
      dynamic_group_limit: 50
    scan_report_schedule_overlap:
      enabled: true
      severity: warn
      assumed_report_duration_minutes: 30
      assumed_scan_duration_minutes: 60
    engine_version_drift:
      enabled: true
      severity: warn
      refresh_stale_days: 7
      check_product_version: true
      check_content_version: true
    insight_agent_deployed:
      enabled: true
      severity: info
      warn_below_percent: 70

# -----------------------------------------------------------------------------
# User & Permission Audit
# -----------------------------------------------------------------------------
user_audit:
  enabled: true
  full_scan: false
  sample_size: 500
  rules:
    privileged_user_without_mfa:
      enabled: true
      severity: fail
      mfa_exempt_logins: []
    local_account_when_sso_configured:
      enabled: true
      severity: warn
      max_local_accounts_when_sso: 2
    multiple_global_administrators:
      enabled: true
      severity: warn
      max_global_administrators: 2
    locked_user_account:
      enabled: true
      severity: warn
    disabled_user_with_role_bindings:
      enabled: true
      severity: warn
    user_with_role_but_no_access:
      enabled: true
      severity: warn
    superuser_flag_outside_global_admin:
      enabled: true
      severity: fail

# -----------------------------------------------------------------------------
# Cloud Integration — Insight Platform (v4 API), required for Cloud Drift Audit
# -----------------------------------------------------------------------------
cloud_integration:
  enabled: false
  base_url: "https://us.api.insight.rapid7.com/vm/"
  api_key_env: "R7_CLOUD_API_KEY"
  timeout_seconds: 30
  max_retries: 3
  parallel_pages: 1

# -----------------------------------------------------------------------------
# Cloud Drift Audit
# -----------------------------------------------------------------------------
cloud_drift:
  rules:
    cd.console_asset_count_drift:
      enabled: true
      severity: warn
      tolerance_percent: 5
    cd.scan_engine_cloud_registration:
      enabled: true
      severity: warn
      last_seen_max_age_hours: 24
      ignore_engines: []
    cd.stale_assessment_cohort:
      enabled: true
      severity: warn
      stale_after_days: 30
      max_stale_percent: 10
      max_stale_count: null
